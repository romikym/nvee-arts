# Netlify configuration for NVee Arts.
#
# Deploys the static site from the repository root and bundles serverless
# functions out of netlify/functions/. Stripe payments are handled by
# /.netlify/functions/create-payment-intent.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # esbuild is faster and produces smaller bundles than the default zisi.
  node_bundler = "esbuild"
  # Include products.json in the function bundle so the function can
  # validate prices server-side.
  included_files = ["data/products.json"]
  # @netlify/blobs MUST stay external — esbuild bundles strip out the
  # runtime context that Blobs needs to auto-detect the site, which
  # causes "MissingBlobsEnvironmentError" at runtime.
  external_node_modules = ["@netlify/blobs"]


# SPA-style fallback is not needed — this is a multi-page static site.
