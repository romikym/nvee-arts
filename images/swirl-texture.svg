<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="marble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="4" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="380"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="marble2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="3" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="220"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0077c2" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7ce5ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="ribbon3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#001f3f" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <g filter="url(#marble)" opacity="0.95">
    <rect x="-200" y="100" width="2000" height="120" fill="url(#ribbon1)"/>
    <rect x="-200" y="400" width="2000" height="90" fill="url(#ribbon2)"/>
    <rect x="-200" y="700" width="2000" height="140" fill="url(#ribbon3)"/>
    <rect x="-200" y="1000" width="2000" height="100" fill="url(#ribbon1)"/>
    <rect x="-200" y="1300" width="2000" height="120" fill="url(#ribbon2)"/>
  </g>
  <g filter="url(#marble2)" opacity="0.65">
    <rect x="-200" y="250" width="2000" height="20" fill="#ffffff"/>
    <rect x="-200" y="560" width="2000" height="14" fill="#ffffff"/>
    <rect x="-200" y="870" width="2000" height="18" fill="#ffffff"/>
    <rect x="-200" y="1180" width="2000" height="16" fill="#ffffff"/>
  </g>
  <g opacity="0.5">
    <circle cx="280" cy="320" r="4" fill="#ffffff"/>
    <circle cx="520" cy="180" r="3" fill="#ffffff"/>
    <circle cx="780" cy="440" r="5" fill="#ffffff"/>
    <circle cx="1020" cy="280" r="3" fill="#ffffff"/>
    <circle cx="1280" cy="520" r="4" fill="#ffffff"/>
    <circle cx="380" cy="620" r="3.5" fill="#ffffff"/>
    <circle cx="640" cy="780" r="4" fill="#ffffff"/>
    <circle cx="940" cy="660" r="3" fill="#ffffff"/>
    <circle cx="1180" cy="820" r="4" fill="#ffffff"/>
    <circle cx="220" cy="940" r="3" fill="#ffffff"/>
    <circle cx="480" cy="1080" r="4" fill="#ffffff"/>
    <circle cx="820" cy="1180" r="3.5" fill="#ffffff"/>
    <circle cx="1120" cy="1020" r="3" fill="#ffffff"/>
    <circle cx="1420" cy="1240" r="4" fill="#ffffff"/>
    <circle cx="300" cy="1380" r="3" fill="#ffffff"/>
    <circle cx="720" cy="1440" r="3.5" fill="#ffffff"/>
  </g>
</svg>
